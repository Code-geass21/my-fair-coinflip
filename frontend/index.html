<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Fair Coin Flip</title>
    <link rel="stylesheet" href="/game/style.css">
</head>
<body>
    <div class="container">
        <h1>Our Fair Coin Flip</h1>

        <div id="auth-screen">
            <h2 id="auth-title">Log In</h2>
            <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
            <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
            <div id="auth-buttons">
                <button id="login-btn">Log In</button>
                <button id="register-btn">Register</button>
            </div>
            <div id="auth-status"></div>
        </div>

        <div id="game-room" class="hidden">

            <div id="top-bar">
                <div id="role-banner"></div>
                <button id="logout-btn">Log Out</button>
            </div>
            <div id="lifetime-stats"></div>

            <div class="score-board">
                <div id="score-playerA">Player A: 0</div>
                <div id="current-toss">Toss: 0/10</div>
                <div id="score-playerB">Player B: 0</div>
            </div>

            <div id="coin">
                <div class="side heads">
                    <div class="coin-rim"></div>
                    <div class="coin-face">
                        <div class="coin-ring"></div>
                        <span class="coin-symbol">❀</span>
                    </div>
                </div>
                <div class="side tails">
                    <div class="coin-rim"></div>
                    <div class="coin-face">
                        <div class="coin-chakra"></div>
                        <span class="coin-symbol coin-symbol-small">👤</span>
                    </div>
                </div>
            </div>

            <div id="guess-controls" class="hidden">
                <p>Your call — heads or tails?</p>
                <button class="guess-btn" data-choice="heads">Heads</button>
                <button class="guess-btn" data-choice="tails">Tails</button>
            </div>

            <div id="flip-controls" class="hidden">
                <button id="flip-btn" disabled>Flip!</button>
            </div>

            <div id="status">Connecting...</div>

            <div id="game-over-panel" class="hidden">
                <h2 id="game-over-title"></h2>
                <button id="play-again-btn">Play Again</button>
            </div>
        </div>
    </div>
    <script src="/game/script.js"></script>
</body>
</html>
